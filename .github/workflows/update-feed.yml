name: Update MonoMarket feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install beautifulsoup4

      - run: python convert.py

      - run: python convert_products.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mono.json docs/products.xml docs/products-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Update MonoMarket feeds"
          git push
